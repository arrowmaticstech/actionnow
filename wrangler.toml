name = "localeyes"
compatibility_date = "2024-06-08"
main = "worker/index.js"

# Run before `wrangler deploy` so dist/ exists (Cloudflare CI runs deploy only).
[build]
command = "npm run build"

[assets]
directory = "./"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/hf/*"]
